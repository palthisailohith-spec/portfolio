<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portfolio responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#deded7;font:13px system-ui}.toolbar{height:56px;display:flex;align-items:center;gap:10px;padding:9px 15px;position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #999}.toolbar button{padding:7px 10px;cursor:pointer}#stage{position:relative;margin:14px auto;background:#f4f3ee;box-shadow:0 2px 15px #0002}iframe{border:0;display:block;transform-origin:top left}#result{font-size:11px;margin-left:auto}</style></head><body><div class="toolbar"><b>Viewport</b><button data-width="360">360</button><button data-width="390">390</button><button data-width="768">768</button><button data-width="1024">1024</button><button data-width="1440">1440</button><button data-width="1920">1920</button><span id="result"></span></div><div id="stage"><iframe id="preview" title="Portfolio review viewport" src="../dist/index.html"></iframe></div><script>const frame=document.querySelector('#preview'),stage=document.querySelector('#stage');let width=1440;function fit(){const scale=Math.min(1,(innerWidth-40)/width);frame.style.width=width+'px';const height=width<=480?844:900;frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.width=width*scale+'px';stage.style.height=height*scale+'px';report()}function report(){try{const doc=frame.contentDocument;document.querySelector('#result').textContent='CSS width '+frame.contentWindow.innerWidth+' / document '+doc.documentElement.scrollWidth+'px'}catch{}}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);fit()});frame.onload=()=>{fit();new ResizeObserver(report).observe(frame.contentDocument.body)};addEventListener('resize',fit);fit()</script></body></html>
